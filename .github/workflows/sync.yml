name: Synchronize repositories

on:
  schedule:
    # Monday-Friday, UTC+8: 09:00-12:00 and 14:00-19:00, inclusive.
    - cron: '*/30 1-3,6-10 * * 1-5'
    - cron: '0 4,11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-mirror
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      synchronized_at: ${{ steps.synchronize.outputs.synchronized_at }}
    steps:
      - name: Check out trusted controller code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Synchronize and verify private references
        id: synchronize
        env:
          SOURCE_REPO_URL: ${{ secrets.SOURCE_REPO_URL }}
          SOURCE_USERNAME: ${{ secrets.SOURCE_USERNAME }}
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          TARGET_REPO_URL: ${{ secrets.TARGET_REPO_URL }}
          TARGET_SSH_KEY: ${{ secrets.TARGET_SSH_KEY }}
        run: uv run --no-project python scripts/sync.py

  record-success:
    needs: synchronize
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out trusted controller code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Update only this controller repository's README
        env:
          GH_TOKEN: ${{ github.token }}
          SYNCHRONIZED_AT: ${{ needs.synchronize.outputs.synchronized_at }}
        run: uv run --no-project python scripts/update_status.py
